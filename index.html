<!DOCTYPE html>
<html>

<head>
    <title>Courses</title>
</head>

<body>
    <h1 class="head">Harrison Bennett J</h1>
    <button>Hello</button>
    <h2>Select Course</h2>

    <select id="courseDropdown">
        <option>Loading...</option>
    </select>

    <script>

        fetch("https://deploy-learn-2.onrender.com/courses")
            .then(response => response.json())
            .then(data => {

                const dropdown = document.getElementById("courseDropdown");
                dropdown.innerHTML = "";

                data.forEach(course => {

                    const option = document.createElement("option");
                    option.value = course.sno;
                    option.text = course.course_name;

                    dropdown.appendChild(option);

                });

            });

    </script>

</body>

</html>
